<body>
<main>
  <header class="top"><div class="brand"><i>围</i>围栏报价系统 <small style="font-size:10px;color:#6a7b70">重构版</small></div><nav class="tabs"><button class="active" data-view="quote">报价页</button><button data-view="archives">档案中心</button></nav></header>

  <section id="quote" class="view active">
    <div class="quote-headings"><div class="compact-heading"><h1>围栏报价</h1><p>左侧填写本次参数，右侧即时显示成本与报价结果。</p></div><div class="result-heading"><h2>可核对材料清单</h2><p>本次用料、重量与费用明细。</p></div></div>

      <section class="quote-form">
        <section class="form-section"><h2>结构</h2><div class="compact-grid">

          <label class="compact-field"><span>安装方式</span><select id="mount"><option value="flange">法兰盘式</option><option value="embed">预埋式</option></select></label>
          <label class="compact-field"><span>表面工艺</span><span class="surface-inputs"><select id="process"><option value="spray">喷塑</option><option value="dip">浸塑</option></select><input id="coatPriceKg" type="number" min="0" step="0.1" inputmode="decimal" aria-label="临时表面处理单价，每公斤" placeholder="元/kg"></span></label>
          <label class="compact-field span2 flange-only"><span>法兰盘</span><select id="flange"></select></label>

    </section>
  </section>

  <section id="archives" class="view"><div class="heading"><h1>档案中心</h1><p>每条记录独立维护。报价页只调用本次选中的档案；修改档案不会改变已展示的用料逻辑。</p></div><section class="archive-layout"><aside class="archive-menu" id="archiveMenu"></aside><section class="card"><div class="archive-title"><div><h2 id="archiveTitle"></h2><p id="archiveDesc"></p></div><button id="newRecord" class="btn primary">新增档案</button></div><div id="archiveForm"></div><div class="archive-table"><table><thead id="archiveHead"></thead><tbody id="archiveRows"></tbody></table></div><p class="footnote">管材重量在报价页按外径/边长和壁厚公式重新计算；档案里的单价用于匹配实际规格与壁厚。</p></section></section></section>
</main>

   const weld=(usageText.match(/焊接\s*¥?([\d.]+)/)||[])[1]||'0',assembly=(usageText.match(/组装\s*¥?([\d.]+)/)||[])[1]||'0';
   out+=compactLiveItem(name,[{priceLabel:'焊接',price:`${weld} 元/套`,usageLabel:'数量',usage:'1 套',feeLabel:'焊接',fee:`¥${weld}`},{priceLabel:'组装',price:`${assembly} 元/套`,usageLabel:'数量',usage:'1 套',feeLabel:'组装',fee:`¥${assembly}`}],total);return
  }
  if(name==='法兰盘'&&p.length>1){
   out+=compactLiveItem(name,[{priceLabel:'材料',price:cleanDetailPrice(p[0]),usageLabel:'数量',usage:u[0]||'',feeLabel:'材料',fee:materialFee},{priceLabel:'表处',price:cleanDetailPrice(p[1]),usageLabel:'重量',usage:weight,feeLabel:'表处',fee:surfaceFee}],total);return
  }
  const fee=f[0]||'',m=fee.match(/^([^¥\d—]+)\s*(.*)$/),feeLabel=m?m[1].trim():'费用',feeValue=m?m[2].trim():fee;
  let qty=(name==='钢筋'||name==='压扁条'?u.find(x=>/m/i.test(x)&&!/kg/i.test(x)):u.find(x=>!/kg/i.test(x)))||'';
  qty=cleanDetailText(qty).replace(/（.*$/,'').replace(/(\d+(?:\.\d+)?)m\b/gi,'$1 米');
  const rows=[{priceLabel:'单价',price:cleanDetailPrice(priceText),usageLabel:/米$/.test(qty)?'用量':'数量',usage:qty,feeLabel,fee:feeValue}];
  if(weight)rows.push({priceLabel:'',price:'',usageLabel:'重量',usage:weight,feeLabel:'',fee:''});
  out+=compactLiveItem(name,rows,total)
 });
 return out
}
function renderQuoteArchive(){const records=db.quote||[];$('archives').classList.add('quote-archive-view');$('archiveTitle').textContent='报价底单';$('archiveDesc').textContent='每条底单保存了当时的规格、材料单价、用量和计算明细。';$('newRecord').style.display='none';$('archiveForm').innerHTML='';$('archiveHead').innerHTML='<tr><th>报价对象</th><th>日期</th><th>平米单价</th><th>单套价格</th><th>单套重量</th><th>保存时间</th><th>操作</th></tr>';$('archiveRows').innerHTML=records.length?records.map(r=>{const x=r.inputs||{},id=String(r.id);return `<tr><td>${esc(r.customer)}</td><td>${esc(r.date)}</td><td>${money(r.metrics.unitPrice)}/㎡</td><td>${money(r.metrics.setCost)}</td><td>${kg(r.metrics.weight)}</td><td>${esc(r.savedAt)}</td><td class="quote-actions"><div class="quote-action-row"><button class="btn" data-quote-toggle="${esc(id)}">查看</button><button class="btn danger quote-delete-mini" data-quote-del="${esc(id)}">删除</button></div></td></tr><tr class="quote-detail-row hidden" data-quote-detail="${esc(id)}"><td colspan="7"><div class="quote-detail-panel"><div class="quote-detail-tags"><span>${esc(x.shape)}</span><span>${esc(x.connect)}</span><span>柱距 ${esc(x.span)}m</span><span>高度 ${esc(x.height)}m</span></div><table class="quote-detail-table"><thead><tr><th>项目</th><th>规格 / 单价</th><th>用量 / 重量</th><th>费用</th><th>小计</th></tr></thead><tbody>${formatSavedBom(r.bomHtml)}</tbody></table><div class="quote-detail-total"><span>单套总重量<b>${kg(r.metrics.weight)}</b></span><span>单套价格<b>${money(r.metrics.setCost)}</b></span><span>平米单价<b>${money(r.metrics.unitPrice)}/㎡</b></span></div></div></td></tr>`}).join(''):'<tr><td colspan="7" class="empty">暂无保存的报价底单</td></tr>';$('archiveRows').onclick=e=>{const toggle=e.target.closest('[data-quote-toggle]');if(toggle){const row=document.querySelector(`[data-quote-detail="${toggle.dataset.quoteToggle}"]`),opening=row.classList.contains('hidden');row.classList.toggle('hidden');toggle.textContent=opening?'收起':'查看';return}const del=e.target.closest('[data-quote-del]');if(del&&confirm('确定删除这条报价底单吗？')){db.quote=db.quote.filter(r=>String(r.id)!==String(del.dataset.quoteDel));save();renderQuoteArchive()}}}
function saveQuoteRecord(){const customer=$('quoteCustomer').value.trim();if(!customer){alert('请先填写客户或项目名称');return}if(!quoteSnapshot){alert('报价数据尚未计算完成');return}const record=structuredClone(quoteSnapshot);record.id=Date.now();record.customer=customer;record.date=$('quoteDate').value;record.savedAt=new Date().toLocaleString('zh-CN');db.quote.unshift(record);save();alert('报价底单已保存')}
$('saveQuote').onclick=saveQuoteRecord;$('archiveMenu').addEventListener('click',e=>{if(!e.target.dataset.type)return;if(e.target.dataset.type==='quote')renderQuoteArchive();else $('newRecord').style.display='' });
</script>
